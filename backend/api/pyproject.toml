[project]
name = "agent-office-api"
version = "0.1.0"
description = "Agent Office backend: execution runtime and persistence"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "pydantic>=2.7",
  "mcp>=2.0,<3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=13",
  "fastembed>=0.4,<1",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20",
  "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["models*", "runtime*", "services*", "events*", "routers*"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]
